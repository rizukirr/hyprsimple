name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      # The default shallow checkout is enough: no suite reads git history.
      - uses: actions/checkout@v4

      - name: Install Lua and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 imagemagick shellcheck
          # The suites invoke `lua`. Ubuntu installs `lua5.4`, so make the
          # plain name exist rather than relying on the package to register it.
          sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

      # Runs first: a shell bug is worth seeing before a suite that may fail
      # because of it. hotspot.sh is excluded as vendored third party, 2035
      # lines of create_ap that this project does not maintain. Migrations are
      # checked as bash explicitly, since they deliberately carry no shebang.
      - name: shellcheck
        run: |
          # hotspot.sh is vendored create_ap, 2035 lines this project does not
          # maintain. zsh.sh is zsh, which shellcheck cannot parse at all.
          mapfile -t bins < <(find .local/bin -maxdepth 1 -name '*.sh' \
            ! -name 'hotspot.sh' ! -name 'zsh.sh' | sort)
          # style is the lowest severity, and it is where SC2012 lives. Parsing
          # ls output is the one finding class this project has actually shipped
          # as a bug, in #52, so warning was set above the severity of the bugs
          # being made. SC2016 is excluded: every occurrence here is a grep
          # pattern or a stub written to disk, where single quotes are correct,
          # and the suites read shell source as data so it recurs by design.
          #
          # This runner's shellcheck is older than a current Arch one, and the
          # difference is not only that the old one knows less. SC2002 was a
          # default check here and became optional in 0.10, so it fails this
          # step while a newer local shellcheck reports nothing. To reproduce
          # this step locally, add --enable=all and read only the codes this
          # step would have caught.
          shellcheck --version | grep version:
          shellcheck --severity=style --exclude=SC2016 \
            install.sh bootstrap.sh "${bins[@]}" test/*.sh
          # Migrations deliberately carry no shebang, so the shell is stated
          # here. They are held to the same threshold, not because the shipped
          # ones will ever run again, since install.sh pre-creates their
          # markers, but because a future one runs unattended exactly once on
          # every machine and cannot be re-run.
          shellcheck --severity=style --exclude=SC2016 --shell=bash migrations/*.sh

      - name: install-copy-test
        run: bash test/install-copy-test.sh

      - name: config-split-test
        run: lua test/config-split-test.lua

      - name: config-migration-test
        run: bash test/config-migration-test.sh

      - name: config-realworld-test
        run: bash test/config-realworld-test.sh

      - name: shallow-install-test
        run: bash test/shallow-install-test.sh

      - name: theme-refresh-test
        run: bash test/theme-refresh-test.sh

      - name: dunst-split-test
        run: bash test/dunst-split-test.sh

      - name: hypr-conf-split-test
        run: bash test/hypr-conf-split-test.sh

      - name: waybar-refresh-test
        run: bash test/waybar-refresh-test.sh

      - name: theme-picker-test
        run: bash test/theme-picker-test.sh

      - name: update-channel-test
        run: bash test/update-channel-test.sh

      - name: rofi-split-smoke
        run: bash test/rofi-split-smoke.sh

      - name: rofi-split-migration-test
        run: bash test/rofi-split-migration-test.sh

      - name: update-self-replace-test
        run: bash test/update-self-replace-test.sh

      - name: template-delivery-test
        run: bash test/template-delivery-test.sh

      - name: config-drift-report-test
        run: bash test/config-drift-report-test.sh

      - name: template-cleanup-test
        run: bash test/template-cleanup-test.sh

      - name: wlogout-theme-test
        run: bash test/wlogout-theme-test.sh

      - name: template-autorender-test
        run: bash test/template-autorender-test.sh

      - name: package-install-test
        run: bash test/package-install-test.sh

      - name: notification-idiom-test
        run: bash test/notification-idiom-test.sh

      - name: screenshot-and-battery-test
        run: bash test/screenshot-and-battery-test.sh

      - name: hw-predicate-test
        run: bash test/hw-predicate-test.sh

      - name: untested-script-bugs-test
        run: bash test/untested-script-bugs-test.sh

      - name: muslimtify-and-dns-test
        run: bash test/muslimtify-and-dns-test.sh

      # Last on purpose: it audits the suites above rather than the product, so
      # a real failure should be read before its hygiene report.
      - name: suite-hygiene-test
        run: bash test/suite-hygiene-test.sh
