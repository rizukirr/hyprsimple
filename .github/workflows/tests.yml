      - name: vars-key-removal-test
        run: bash test/vars-key-removal-test.sh

      - name: generated-cleanup-test
        run: bash test/generated-cleanup-test.sh

      - name: committed-symlinks-test
        run: bash test/committed-symlinks-test.sh

      - name: confirm-before-delete-test
        run: bash test/confirm-before-delete-test.sh

      - name: powermenu-test
        run: bash test/powermenu-test.sh

      - name: shell-init-test
