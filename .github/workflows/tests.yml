name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      # The default shallow checkout is enough: no suite reads git history.
      - uses: actions/checkout@v4

      - name: Install Lua and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 imagemagick
          # The suites invoke `lua`. Ubuntu installs `lua5.4`, so make the
          # plain name exist rather than relying on the package to register it.
          sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

      - name: install-copy-test
        run: bash test/install-copy-test.sh

      - name: config-split-test
        run: lua test/config-split-test.lua

      - name: config-migration-test
        run: bash test/config-migration-test.sh

      - name: config-realworld-test
        run: bash test/config-realworld-test.sh

      - name: shallow-install-test
        run: bash test/shallow-install-test.sh

      - name: theme-refresh-test
        run: bash test/theme-refresh-test.sh

      - name: dunst-split-test
        run: bash test/dunst-split-test.sh

      - name: hypr-conf-split-test
        run: bash test/hypr-conf-split-test.sh

      - name: waybar-refresh-test
        run: bash test/waybar-refresh-test.sh

      - name: theme-picker-test
        run: bash test/theme-picker-test.sh

      - name: update-channel-test
        run: bash test/update-channel-test.sh

      - name: rofi-split-smoke
        run: bash test/rofi-split-smoke.sh

      - name: rofi-split-migration-test
        run: bash test/rofi-split-migration-test.sh

      - name: update-self-replace-test
        run: bash test/update-self-replace-test.sh

      - name: template-delivery-test
        run: bash test/template-delivery-test.sh

      - name: config-drift-report-test
        run: bash test/config-drift-report-test.sh

      - name: template-cleanup-test
        run: bash test/template-cleanup-test.sh

      - name: wlogout-theme-test
        run: bash test/wlogout-theme-test.sh

      - name: template-autorender-test
        run: bash test/template-autorender-test.sh

      # Last on purpose: it audits the suites above rather than the product, so
      # a real failure should be read before its hygiene report.
      - name: suite-hygiene-test
        run: bash test/suite-hygiene-test.sh
