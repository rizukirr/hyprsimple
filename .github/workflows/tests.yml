      - name: screenshot-and-battery-test
        run: bash test/screenshot-and-battery-test.sh

      - name: screen-record-test
        run: bash test/screen-record-test.sh

      - name: rofi-theme-link-test
        run: bash test/rofi-theme-link-test.sh

      - name: setup-network-test
        run: bash test/setup-network-test.sh

      - name: hybrid-gpu-env-test
        run: bash test/hybrid-gpu-env-test.sh

      - name: nvidia-install-test
        run: bash test/nvidia-install-test.sh

      - name: hw-predicate-test
        run: bash test/hw-predicate-test.sh

      - name: untested-script-bugs-test
        run: bash test/untested-script-bugs-test.sh

      - name: muslimtify-and-dns-test
        run: bash test/muslimtify-and-dns-test.sh

      - name: launched-programs-test
