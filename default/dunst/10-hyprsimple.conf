[global]
    follow = mouse
    indicate_hidden = yes

    offset = (10, 10)

    separator_height = 2

    padding = 8
    horizontal_padding = 8
    text_icon_padding = 0
    frame_width = 2

    frame_color = "#a6adc8"
    separator_color = frame

    sort = yes
    idle_threshold = 120
    font = monospace 10
    line_height = 0
    markup = full
    alignment = left
    vertical_alignment = center
    show_age_threshold = 60
    word_wrap = yes
    stack_duplicates = true
    hide_duplicate_count = false

    show_indicators = yes

    min_icon_size = 0
    max_icon_size = 64

    # Was eleven hardcoded /usr/share/icons/Papirus-Dark/16x16/* paths, and
    # papirus-icon-theme was in neither package list, so every one of them
    # resolved to nothing. Naming themes instead lets dunst do its own lookup,
    # and the fallback means a missing theme degrades rather than disappears.
    icon_theme = "Papirus-Dark, Adwaita"
    enable_recursive_icon_lookup = true

    # rofi, not wofi: wofi is in neither package list, and rofi is what
    # hyprsimple installs and uses everywhere else.
    dmenu = /usr/bin/rofi -dmenu -p dunst:
    browser = /usr/bin/brave

    title = Dunst
    class = Dunst

    corner_radius = 10
    timeout = 5

[urgency_low]
    background = "#1e1e2e"
    foreground = "#CDD6F4"

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#CDD6F4"

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#CDD6F4"
    frame_color = "#FAB387"
