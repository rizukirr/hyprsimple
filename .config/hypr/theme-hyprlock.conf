# Do not edit this file. It is generated from the active theme's colours and
# overwritten in full on every theme switch, so anything you put here is gone
# by the next one.
#
# To restyle the lock screen, edit ~/.config/hypr/hyprlock.conf, which is
# yours and is sourced after this file.

$color = rgba(45,53,59, 1.0)
$inner_color = rgba(45,53,59, 0.8)
$outer_color = rgba(211,198,170, 1.0)
$font_color = rgba(211,198,170, 1.0)
$check_color = rgba(127,187,179, 1.0)
