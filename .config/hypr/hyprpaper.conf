# Do not edit this file. It is rewritten in full every time the wallpaper or
# the theme changes, and on every live-wallpaper toggle, so anything you put
# here is gone by the next switch.
#
# The wallpaper is chosen with SUPER + W, or by switching theme.

wallpaper {
    monitor =
    path = ~/.config/hypr/themes/deep-sea/backgrounds
    fit_mode = cover
    timeout = 30
}

splash = false
ipc = true
